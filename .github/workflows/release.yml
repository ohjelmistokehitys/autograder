name: Release to new branch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          npm run build
          chmod +x dist/cli.js

      - name: Read version
        id: version
        run: echo "version=$(jq -r '.version' package.json)" >> "$GITHUB_OUTPUT"

      - name: Create release branch
        run: git checkout -b "release/v${{ steps.version.outputs.version }}"

      - name: Remove dev dependencies
        run: npm prune --omit=dev

      - name: Stage only the files needed to run the action
        run: |
          git rm -r --cached . > /dev/null
          git add -f dist node_modules package.json action.yml

      - name: Commit and push release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Release v${{ steps.version.outputs.version }}"
          git push origin "release/v${{ steps.version.outputs.version }}" --force

      - name: Replace and push version tags
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          MAJOR="${VERSION%%.*}"
          MINOR="${VERSION%.*}"
          for TAG in "v$MAJOR" "v$MINOR" "v$VERSION"; do
            git tag -d "$TAG" 2>/dev/null || true
            git push origin --delete "$TAG" 2>/dev/null || true
            git tag "$TAG"
            git push origin "$TAG"
          done
