name: CI

on:
  push:
    branches:
      - main

jobs:
  test-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: latest

      - name: Install dependencies
        run: npm install

      - name: Run tests with the autograder runner
        run: npm test

      - name: Create release tag
        id: tag
        run: |
          TAG="release-$(date -u +%Y%m%d%H%M%S)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            --title "${{ steps.tag.outputs.tag }}" \
            --notes-file release-notes.md \
            result.json \
            vitest-output.json


  build-and-install-package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: latest

      - name: Build the autograder package
        run: npm run build

      - name: Package into a .tgz file
        run: npm pack

      - name: Install built package in the assignment template
        run: |
          cd assignment-template
          npm install ../ohjelmistokehitys-autograder-*.tgz

      - name: Run tests in the assignment template using the built package
        run: |
          cd assignment-template
          npm test
