name: Autograding

on:
  push:

permissions:
  statuses: write
  contents: read

jobs:
  grade:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Run autograder
        run: node src/start.ts exampleSuite.json --markdown-output "$GITHUB_STEP_SUMMARY" --status-output status.json

      - name: Publish score
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          gh api \
            --method POST \
            repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA \
            -f "state=$(jq -r '.state' status.json)" \
            -f "context=$(jq -r '.context' status.json)" \
            -f "description=$(jq -r '.description' status.json)" \
            -f "target_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

