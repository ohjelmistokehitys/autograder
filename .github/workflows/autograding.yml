name: Autograding

on:
  push:

permissions:
  statuses: write
  contents: read

jobs:
  grade:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Run autograder
        run: node src/start.ts exampleSuite.json --markdown-output summary.md --status-output status.txt

      - name: Publish score
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        # TODO: Replace the score and description with the actual grading results
        run: |
          gh api \
            --method POST \
            repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA \
            -f state=success \
            -f context='Autograder' \
            -f description='Score: 8/10' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Save step summary
        run:  cat readme.md >> "$GITHUB_STEP_SUMMARY"
