name: Autograding

on:
  push:

permissions:
  statuses: write
  contents: read

jobs:
  grade:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          npm run build
          chmod +x dist/cli.js

      - name: Run autograder
        run: ./dist/cli.js exampleSuite.json "$GITHUB_STEP_SUMMARY" status.json

      - name: Publish score
        run: |
          gh api \
            --method POST \
            repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA \
            -f "state=$(jq -r '.state' status.json)" \
            -f "context=$(jq -r '.context' status.json)" \
            -f "description=$(jq -r '.description' status.json)" \
            -f "target_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

